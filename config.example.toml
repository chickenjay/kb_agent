# Copy to config.local.toml, then fill in the key locally.
# config.local.toml is ignored by Git. Environment variables override its values.
[llm]
base_url = "https://api.deepseek.com"
api_key = ""
model = "deepseek-flash"

[llm.request_options]
response_format = { type = "json_object" }
thinking = { type = "disabled" }
temperature = 0
max_tokens = 2048
